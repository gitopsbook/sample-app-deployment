apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - image: busybox:1.16
          command: ["/bin/sleep", "3600"]
          name: sample-app
          ports:
            - containerPort: 8080
